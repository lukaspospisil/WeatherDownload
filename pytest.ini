[pytest]
pythonpath = .
# Keep root-level pytest collection out of transient caches, scratch folders,
# virtualenvs, and build outputs without changing what lives under `tests/`.
norecursedirs =
    .tmp*
    .tmp_pytest_cache
    .pytest_cache
    .tmp
    tmp
    outputs
    build
    dist
    .venv
    .verify-venv
